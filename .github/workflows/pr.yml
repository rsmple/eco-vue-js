name: PR

# The checks a release depends on, run before merging: npm-publish.yml and docs.yml only run once the release exists.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run lint

      # Type-check and the package build, as npm-publish.yml runs it.
      - run: npm run build

      # The docs deploy fails on stale generated API tables.
      - run: node build/docs-generate.ts --check

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npx playwright install --with-deps chromium webkit

      # Builds and previews the docs itself, see playwright.config.ts.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
